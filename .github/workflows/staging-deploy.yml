name: Staging CI/CD Pipeline

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-test:
    name: Validate Quality & Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: turnos_db
          MYSQL_USER: turnos_user
          MYSQL_PASSWORD: turnos_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & Test Server
        env:
          DATABASE_URL: "mysql://turnos_user:turnos_password@127.0.0.1:3306/turnos_db"
          JWT_SECRET: "test-jwt-secret-key-123"
          COOKIE_SECRET: "test-cookie-secret-key-123"
        run: |
          cd server
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm test

      - name: Install & Build Client
        run: |
          cd client
          npm ci
          npm run build

  build-and-push:
    name: Build & Push Docker Images to GHCR
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/tp-awym-server
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Extract metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/tp-awym-client
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

  deploy:
    name: Deploy to Hostinger VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT != '' && secrets.HOSTINGER_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Hostinger Webhook (if configured)
        if: env.WEBHOOK_URL != ''
        run: |
          echo "Disparando webhook de re-despliegue en Hostinger Docker Manager..."
          curl -X POST "$WEBHOOK_URL"

      - name: Copy docker-compose.staging.yml to VPS (SSH)
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: 'docker-compose.staging.yml'
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Execute Deployment Commands on VPS (SSH)
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -af --filter "until=48h"
