services:
  mysql:
    image: mysql:8.0
    container_name: tp-awym-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: turnos_db
      MYSQL_USER: turnos_user
      MYSQL_PASSWORD: turnos_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
